version: '3.9'
name: supersmm

services:
  backend:
    image: registry.gitlab.com/ssmm_ai/vk-boss-core/supersmm
    container_name: backend
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - db
    environment:
      APP_PORT: 3000
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_HOST: db
      APP_SECRET_TOKEN: ${APP_SECRET_TOKEN}
    volumes:
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/create_schemas.sql
    environment:
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_USER: ${APP_DB_USERNAME}
      POSTGRES_DB: ${APP_DB_NAME}


volumes:
  db-data:
